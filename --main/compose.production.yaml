services:
  app:
    ports: !reset []
    environment:
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN}
      ALLOW_INSECURE_LOCAL: "false"
      TRUST_PROXY: 172.30.50.0/24
    networks: [default]
  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
  mailpit:
    profiles: [local-mail-only]
networks:
  default:
    ipam:
      config: [{subnet: 172.30.50.0/24}]
volumes:
  caddy_data:
  caddy_config:
